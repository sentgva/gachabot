name: Синхронизация данных

# Раз в неделю подтягивает базовые данные и картинки новых персонажей с encore.moe.
# Сборки, тир-лист и баннеры правятся вручную — скрипт их не трогает.
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync -- --add
      - run: npm run check
      - name: Коммит, если что-то изменилось
        run: |
          if git diff --quiet -- . ':!webapp/data/meta.json' && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Изменений нет"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: автосинхронизация с encore.moe"
          git push
          # пуш от GITHUB_TOKEN не запускает другие workflow — деплоим явно
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
